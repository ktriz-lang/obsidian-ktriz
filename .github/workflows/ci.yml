name: CI

# Runs on every push and pull request against master — release.yml only
# triggers on version tags, so without this, `main.js` could ship a type
# error or a broken sanitisation code path with nothing having checked it
# since the last tag. `npm test` here is the CI-safe subset (typecheck +
# the pure-logic and jsdom-backed suites): it deliberately excludes
# verify:cli, which needs a real ktriz CLI binary this runner doesn't have.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 (this repo's original default) fails verify:dom here: jsdom's
      # undici dependency throws "webidl.util.markAsUncloneable is not a
      # function" while importing jsdom's Cache/CacheStorage shim on some
      # Node 20.x builds. Node 22 (matching local dev) does not hit this.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm audit` no longer works on the runner (the registry retired its
      # legacy audit endpoint: HTTP 400 "Invalid package tree"). The OSV script
      # queries osv.dev instead; unlike `--audit-level=high` it has no severity
      # threshold, so any known advisory fails the build. Exit code 2 (the check
      # itself failed) also fails the build — never treated as green.
      - name: Audit dependencies
        run: npm run audit:osv

      - name: Typecheck + verify:pure + verify:dom
        run: npm test
